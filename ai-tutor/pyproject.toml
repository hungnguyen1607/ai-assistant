[project]
name = "ai-tutor"
version = "0.1.0"
description = "Local AI tutor: RAG over course materials, vision OCR for math pages, SymPy-verified solutions"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "python-dotenv>=1.0",
    "pymupdf>=1.24",
    "sympy>=1.13",
    "numpy>=1.26",
    "fastembed>=0.4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
tutor = "tutor.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tutor"]
